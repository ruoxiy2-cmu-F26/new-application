<!DOCTYPE html>
<html>

<head>
    <title> Welcome page </title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <section class="newevent">
        <header class="header_newevent">New Event</header>
        <form>
            <div class="div_title">
                <label>Title</label>
                <input class="input_title" type="text" placeholder="Study Group">
            </div>


            <div class="div_date_time">
                <div class="div_date">
                    <label>Date</label>
                    <input class="input_date" type="date">
                </div>
                <div class="div_time">
                    <label>Time</label>
                    <input class="input_time" type="time">
                </div>
            </div>

            <div class="div_description">
                <div class="div_description_label">
                    <label>Description</label>
                    <span class="optional">(optional)</span>
                </div>
                <textarea class="input_description" placeholder="Room 204, bring your laptop"></textarea>
            </div>

            <div class="div_invite">
                <label>Invite people</label>
                <input class="input_invite" type="text" placeholder="Ruoxi, Ana, Sam">
                <hint>Separate names with commas</hint>
            </div>

            <button class="button_createevent" type="submit">Create Event</button>
        </form>

    </section>



    <section class="upcoming">
        <header class="header_upcoming">
            <label class="label_upcoming">Upcoming</label>
            <div class="filters">
                <button class="filter_all">All</button>
                <button class="filter_invited">Invited</button>
                <button class="filter_organized">Organized by me</button>
            </div>
        </header>
        <form>

            <!--the first event-->
            <article class="event1">
                <div class="datebox_event1">
                    <div class="month_event1">Oct</div>
                    <div class="day_event1">
                        <div class="daynumber_event1">1</div>
                        <div class="weekday_event1">Thu</div>
                    </div>
                </div>

                <div class="details_event1">
                    <label class="title_event1">FSE project check-in</label>
                    <label class="time_event1">10:30 AM, organized by you</label>
                    <div class="statuschip_event1">
                        <div class="statuschip_event1_1">
                            <label class="dot1">•</label>
                            <label class="label_event1_1">Ruoxi: accepted</label>
                        </div>

                        <div class="statuschip_event1_2">
                            <label class="dot2">•</label>
                            <label class="label_event1_2">Sam: pending</label>
                        </div>
                    </div>
                    <div class="button_event1">
                        <button class="button_event1_markdone">Mark done</button>
                        <button class="button_event1_delete">Delete</button>
                    </div>
                </div>
            </article>
            <div class="divider"></div>

            <!--the second event-->
            <article class="event2">
                <div class="datebox_event2">
                    <div class="month_event2">Oct</div>
                    <div class="day_event2">
                        <div class="daynumber_event2">3</div>
                        <div class="weekday_event2">Sat</div>
                    </div>
                </div>

                <div class="details_event2">
                    <label class="title_event2">Study group: DOM events</label>
                    <label class="time_event2">2:00 PM, organized by you</label>
                    <label class="description_event2">Room 204, bring your laptop</label>
                    <div class="statuschip_event2">
                        <div class="statuschip_event2_1">
                            <label class="dot2">•</label>
                            <label class="label_event2_2">Ruoxi: pending</label>
                        </div>

                        <div class="statuschip_event2_2">
                            <label class="dot2">•</label>
                            <label class="label_event2_2">Ana: pending</label>
                        </div>
                    </div>
                    <div class="button_event2">
                        <button class="button_event2_markdone">Mark done</button>
                        <button class="button_event2_delete">Delete</button>
                    </div>
                </div>
            </article>
            <div class="divider"></div>
        </form>
    </section>


</body>

</html>
